<style>
:root{--rail:#0d1411;--side:#131b17;--main:#18221d;--hover:#1f2c26;--line:#24332b;--text:#e4efe8;--mute:#8fa59a;--green:#73cb27;--green-d:#5fb01c;--ink:#10250a;--red:#ed5565}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--main);color:var(--text);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0}[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.btn{background:var(--green);color:var(--ink);font-weight:600;padding:10px 16px;border-radius:6px}.btn:hover{background:var(--green-d)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}.btn.ghost:hover{background:var(--hover)}
.btn.sm{padding:7px 12px;font-size:14px}.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{background:var(--rail);border:1px solid var(--line);border-radius:6px;padding:10px 12px;width:100%}
textarea{min-height:80px;resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid var(--green);border-color:transparent}
input[type=checkbox]{width:auto}
.bg{min-height:100%;display:grid;place-items:center;padding:20px;background:radial-gradient(900px 500px at 50% -10%,#2c4a17,var(--rail))}
.card{background:var(--side);border:1px solid var(--line);border-radius:12px;padding:32px;width:100%;max-width:400px;display:grid;gap:12px}
.card h1{font-size:26px;text-align:center}.card p{color:var(--mute);text-align:center}
.logo{width:64px;height:64px;border-radius:18px;display:block;margin:0 auto 4px}
.err{color:var(--red);font-size:13px;min-height:16px;text-align:center}
.top{display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--rail);border-bottom:1px solid var(--line)}
.top img{width:34px;height:34px;border-radius:10px}.top b{flex:1;font-size:17px}.top small{color:var(--mute)}
#pick .wrap{max-width:860px;margin:0 auto;padding:28px 20px}
#pick h2{font-size:24px;margin-bottom:4px}#pick .sub{color:var(--mute);margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.sc{background:var(--side);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px}
.sc .h{display:flex;align-items:center;gap:12px;min-width:0}.sc .h b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sc .h small{display:block;color:var(--mute);font-size:12px}
.ic{width:48px;height:48px;border-radius:16px;background:var(--hover);display:grid;place-items:center;font-weight:700;font-size:19px;overflow:hidden;flex:none}.ic img{width:100%;height:100%;object-fit:cover}
.tag{font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;background:var(--green);color:var(--ink)}
#dash{display:grid;grid-template-columns:230px 1fr;height:100%}
.nav{background:var(--side);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.nav .ph{display:flex;align-items:center;gap:10px;padding:0 8px 4px;font-size:17px;font-weight:700}.nav .ph img{width:38px;height:38px;border-radius:11px}
.nav .sv{display:flex;align-items:center;gap:8px;margin:8px 4px 10px;padding:8px;border-radius:8px;background:var(--rail);border:1px solid var(--line);font-size:14px;min-width:0}
.nav .sv .ic{width:30px;height:30px;border-radius:10px;font-size:14px}.nav .sv span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button.t{background:transparent;text-align:left;padding:9px 10px;border-radius:6px;color:var(--mute)}.nav button.t:hover{background:var(--hover);color:var(--text)}.nav button.t.on{background:var(--hover);color:var(--text);font-weight:600}
.nav .sp{flex:1}.cont{overflow-y:auto;padding:24px 28px 60px}.cont>*{max-width:720px}
.cont h2{margin-bottom:4px}small{color:var(--mute)}
.card2{background:var(--side);border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0;display:grid;gap:10px}
.chk{display:flex;align-items:center;gap:10px;cursor:pointer}.row{display:flex;align-items:center;gap:8px;padding:4px 0}
.icon{background:transparent;color:var(--mute);font-size:18px;padding:2px 8px;border-radius:4px}.icon:hover{color:var(--text);background:var(--hover)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0}.stat{background:var(--side);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:2px}.stat b{font-size:26px}
.toast{position:fixed;right:16px;bottom:16px;background:var(--side);border:1px solid var(--green);border-radius:10px;padding:12px 14px;z-index:50;max-width:min(360px,calc(100% - 32px))}
dialog{background:var(--side);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:24px;max-width:420px;width:calc(100% - 32px);margin:auto}dialog::backdrop{background:#000a}dialog .b{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
@media(max-width:700px){#dash{grid-template-columns:1fr;grid-template-rows:auto 1fr}.nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);align-items:center}.nav .ph,.nav .sp{display:none}.nav button.t{white-space:nowrap}.nav .sv{margin:0;min-width:150px}.cont{padding:18px 16px 60px}}
</style></head><body>

<script>
firebase.initializeApp({apiKey:"AIzaSyBJsPaZOArWDvpzEz5sPCxBaJe_Yf7eoTg",authDomain:"concord-cdc9c.firebaseapp.com",databaseURL:"https://concord-cdc9c-default-rtdb.firebaseio.com",projectId:"concord-cdc9c",storageBucket:"concord-cdc9c.firebasestorage.app",messagingSenderId:"663376374883",appId:"1:663376374883:web:7f55fe6f4bec11bea09c56"});
const auth=firebase.auth(),db=firebase.database(),$=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const toast=t=>{const d=el('div','toast',t);document.body.append(d);setTimeout(()=>d.remove(),3500)};
const CONCORD_URL='index.html';
const CMD=['8ball','abraco','adicionar','ajuda','apagar','apostar','avisar','ban','calc','comprar','dado','daily','dar','embed','emojis','enquete','escolher','fechar','inventario','kick','limpar','loja','moeda','mute','nivel','painel','perfil','piada','ping','rank','reabrir','remover','saldo','servidor','setkey','setklipy','ship','suporte','ticket','top','trabalhar','transferir','unban','unmute','versao','fato','hora'];
const joinedOf=c=>!!c&&c.joined!==false&&(!!c.joined||Object.keys(c).length>0);
let me,sid=null,sname='',cfg={},roles={},chans={},members={},subs=[],tab='home';
const R=()=>db.ref('botcfg/'+sid),money=n=>(cfg.currency||'🪙')+' '+Number(n).toLocaleString('pt-BR');
const errBox=t=>$('#err').textContent=t||'';
const MSG={'auth/invalid-credential':'E-mail ou senha incorretos.','auth/user-not-found':'Conta não encontrada.','auth/wrong-password':'Senha incorreta.','auth/invalid-email':'E-mail inválido.','auth/too-many-requests':'Muitas tentativas. Tente de novo mais tarde.','auth/unauthorized-domain':'Adicione este domínio em Authentication > Configurações > Domínios autorizados no Firebase.','auth/popup-closed-by-user':''};
const msgErr=e=>MSG[e.code]??e.message;
$('#login').onclick=()=>{const e=$('#email').value.trim();if(!e||!$('#pass').value)return errBox('Digite e-mail e senha.');errBox('');auth.signInWithEmailAndPassword(e,$('#pass').value).catch(x=>errBox(msgErr(x)))};
$('#pass').addEventListener('keydown',e=>e.key==='Enter'&&$('#login').click());
$('#google').onclick=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>errBox(msgErr(e)));
$('#forgot').onclick=()=>{const e=$('#email').value.trim();if(!e)return errBox('Digite o e-mail acima primeiro.');auth.sendPasswordResetEmail(e).then(()=>errBox('Enviamos um link para o seu e-mail.')).catch(x=>errBox(msgErr(x)))};
$('#out').onclick=()=>auth.signOut();
auth.onAuthStateChanged(async u=>{
  if(!u){me=null;leave();$('#auth').hidden=false;$('#pick').hidden=$('#dash').hidden=true;return}
  me={uid:u.uid,name:u.displayName||(u.email||'').split('@')[0]};
  try{const p=(await db.ref('users/'+me.uid).get()).val();if(p&&p.name)me.name=p.name}catch(e){}
  $('#who').textContent=me.name;$('#auth').hidden=true;
  const q=new URLSearchParams(location.search).get('server');
  if(q)openServer(q);else showPick();
});
const ic=(i,name)=>{const d=el('div','ic');if(i){const m=el('img');m.src=i;m.alt='';d.append(m)}else d.textContent=(name||'?')[0].toUpperCase();return d};
async function showPick(){
  leave();$('#dash').hidden=true;$('#pick').hidden=false;history.replaceState(null,'',location.pathname);
  const box=$('#list');box.replaceChildren(el('small',null,'Carregando seus servidores…'));
  let ids;try{ids=Object.keys((await db.ref('users/'+me.uid+'/servers').get()).val()||{})}catch(e){return box.replaceChildren(el('small',null,'Erro: '+e.message))}
  const L=(await Promise.all(ids.map(async id=>{try{const [s,c]=await Promise.all([db.ref('servers/'+id).get(),db.ref('botcfg/'+id).get()]);const v=s.val();return v?{id,v,joined:joinedOf(c.val()),own:v.owner===me.uid}:null}catch(e){return null}}))).filter(Boolean).sort((a,b)=>b.own-a.own||(a.v.name||'').localeCompare(b.v.name||''));
  box.replaceChildren();if(!L.length)box.append(el('small',null,'Você ainda não está em nenhum servidor. Crie ou entre em um no Concord.'));
  L.forEach(({id,v,joined,own})=>{
    const c=el('div','sc'),h=el('div','h'),t=el('div');t.style.minWidth=0;t.append(el('b',null,v.name||'Servidor'),el('small',null,own?'Você é o dono':'Só o dono pode gerenciar'));h.append(ic(v.icon,v.name),t);
    const b=el('button','btn'+(joined?' ghost':''),joined?'⚙ Configurar':'＋ Adicionar bot');b.disabled=!own;
    if(joined){const g=el('span','tag','NO SERVIDOR');g.style.justifySelf='start';c.append(h,g,b)}else c.append(h,b);
    b.onclick=()=>joined?openServer(id):addBot(id,v);box.append(c);
  });
}
function addBot(id,v){
  $('#dt').textContent='Adicionar o ConcordBot';$('#dp').textContent='O ConcordBot vai entrar em "'+v.name+'" e avisar em um canal de texto. Você poderá configurar tudo no painel.';
  const d=$('#dlg'),y=$('#dyes');d.showModal();$('#dno').onclick=()=>d.close();
  y.onclick=async()=>{y.disabled=true;try{
    await db.ref('botcfg/'+id+'/joined').set({ts:firebase.database.ServerValue.TIMESTAMP,by:me.uid});
    try{const ch=(await db.ref('channels/'+id).get()).val()||{},f=Object.entries(ch).filter(([,x])=>x.type!=='voice').sort((a,b)=>(a[1].pos??1e9)-(b[1].pos??1e9))[0];
      if(f)await db.ref(`messages/${id}/${f[0]}`).push({uid:me.uid,bot:'concord',name:'ConcordBot',photo:'',text:'',embed:{color:'#73cb27',title:'ConcordBot entrou no servidor! 🤖',desc:'Digite !ajuda para ver o que eu faço. O dono configura tudo no painel do ConcordBot.',footer:'ConcordBot'},ts:firebase.database.ServerValue.TIMESTAMP})}catch(e){}
    d.close();toast('ConcordBot entrou em '+v.name+'! 🎉');openServer(id);
  }catch(e){toast('Erro: '+e.message)}y.disabled=false};
}
const leave=()=>{subs.forEach(f=>f());subs=[]};
const on=(r,f)=>{r.on('value',f);subs.push(()=>r.off('value',f))};
async function openServer(id){
  leave();let s;try{s=(await db.ref('servers/'+id).get()).val()}catch(e){toast('Erro: '+e.message)}
  if(!s){toast('Servidor não encontrado.');return showPick()}
  if(s.owner!==me.uid){toast('Só o dono do servidor acessa o painel.');return showPick()}
  sid=id;sname=s.name||'Servidor';cfg={};roles={};chans={};members={};
  if(!joinedOf((await db.ref('botcfg/'+id).get()).val())){return addBot(id,s)}
  history.replaceState(null,'','?server='+id);$('#pick').hidden=true;$('#dash').hidden=false;
  on(db.ref('botcfg/'+id),x=>{cfg=x.val()||{};refresh()});on(db.ref('channels/'+id),x=>{chans=x.val()||{};refresh()});
  on(db.ref('roles/'+id),x=>{roles=x.val()||{};refresh()});on(db.ref('members/'+id),x=>{members=x.val()||{};refresh()});
  on(db.ref('servers/'+id+'/name'),x=>{if(!x.exists())showPick()});
  s.icon&&(icon=s.icon);iconCur=s.icon||'';render();
}
let icon,iconCur='';
const refresh=()=>{if(sid&&!(document.activeElement&&document.activeElement.closest('#c input,#c textarea,#c select')))render()};
const TABS=[['home','📊 Visão geral'],['welcome','👋 Boas-vindas'],['cmds','⌨️ Comandos'],['eco','💰 Economia e loja'],['mod','🛡 Auto-moderação'],['xp','📈 Níveis e XP'],['tk','🎫 Tickets'],['ob','🎯 Onboarding'],['nc','📢 Novidades do Concord']];
function render(){
  const n=$('#nav'),c=$('#c'),sc=c.scrollTop;n.replaceChildren();c.replaceChildren();
  const ph=el('div','ph'),lg=el('img');lg.src=document.querySelector('.logo').src;ph.append(lg,el('span',null,'ConcordBot'));
  const sv=el('div','sv');sv.append(ic(iconCur,sname),el('span',null,sname));
  const sw=el('button','icon','⇄');sw.title='Trocar de servidor';sw.onclick=showPick;sv.append(sw);n.append(ph,sv);
  TABS.forEach(([k,l])=>{const b=el('button','t'+(k===tab?' on':''),l);b.onclick=()=>{tab=k;render()};n.append(b)});
  const sp=el('div','sp'),cl=el('a','t','↩ Voltar ao Concord');cl.href=CONCORD_URL;cl.className='btn ghost sm';cl.style.cssText='text-align:center;text-decoration:none;margin-top:8px';
  const rm=el('button','btn ghost sm','Remover bot do servidor');rm.style.cssText='margin-top:6px;color:var(--red)';
  rm.onclick=()=>confirm('Remover o ConcordBot deste servidor? Os comandos deixam de responder (suas configurações são mantidas).')&&R().child('joined').set(false).then(()=>showPick());
  n.append(sp,cl,rm);P[tab](c,kit(c));c.scrollTop=sc;
}
